name: CI - Build, Test, Scan, Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test --if-present
        working-directory: server

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false --passWithNoTests

  build-scan-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image path
        run: echo "IMAGE_PATH=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------- Backend ----------------
      - name: Build backend image (local, for scan)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          load: true
          tags: ghcr.io/${{ env.IMAGE_PATH }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_PATH }}/backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PATH }}/backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_PATH }}/backend:latest

      # ---------------- Frontend ----------------
      - name: Build frontend image (local, for scan)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          build-args: |
            REACT_APP_BASE_URL=${{ vars.REACT_APP_BASE_URL }}
            REACT_APP_RAZORPAY_KEY=${{ secrets.REACT_APP_RAZORPAY_KEY }}
          tags: ghcr.io/${{ env.IMAGE_PATH }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_PATH }}/frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            REACT_APP_BASE_URL=${{ vars.REACT_APP_BASE_URL }}
            REACT_APP_RAZORPAY_KEY=${{ secrets.REACT_APP_RAZORPAY_KEY }}
          tags: |
            ghcr.io/${{ env.IMAGE_PATH }}/frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_PATH }}/frontend:latest