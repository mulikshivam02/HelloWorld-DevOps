version: "3.9"

services:
  mongodb:
    image: mongo:6
    container_name: HelloWorld-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - HelloWorld-net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: HelloWorld-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/test
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    networks:
      - HelloWorld-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_BASE_URL: http://localhost:4000/api/v1
    container_name: HelloWorld-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - HelloWorld-net

networks:
  HelloWorld-net:
    driver: bridge

volumes:
  mongo_data:
